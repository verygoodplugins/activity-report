<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Pulse | Activity Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --surface-elevated: #F5F5F3;
      --border: #E8E6E3;
      --text: #3A3A3A;
      --text-secondary: #6B6B6B;
      --accent: #B4A5C7;
      --accent-light: rgba(180, 165, 199, 0.15);
      --green: #94B49F;
      --green-light: rgba(148, 180, 159, 0.2);
      --red: #E8A598;
      --red-light: rgba(232, 165, 152, 0.2);
      --purple: #B4A5C7;
      --amber: #E8C49A;
      --cyan: #A8D8D4;
      --pink: #E8B4C4;
      --sage: #94B49F;
      --lavender: #B4A5C7;
      --coral: #E8A598;
      --mint: #A8D8D4;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .noise {
      display: none;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
    }

    /* Back Links */
    .back-links {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .back-link {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    /* Hero Section */
    .hero {
      position: relative;
      padding: 3rem 0;
      margin-bottom: 3rem;
    }

    .hero-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 3rem;
      flex-wrap: nowrap;
    }

    .hero-left h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .hero-tagline {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    .hero-stats {
      display: flex;
      gap: 1.5rem;
    }

    .hero-left {
      flex-shrink: 0;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem 1.85rem;
      text-align: center;
      min-width: 100px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .stat-card.repos::before { background: var(--sage); }
    .stat-card.commits::before { background: var(--lavender); }
    .stat-card.added::before { background: var(--green); }
    .stat-card.deleted::before { background: var(--red); }
    .stat-card.prs::before { background: var(--mint); }

    /* Time Toggle */
    .time-toggle {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .toggle-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .stat-card.added .stat-value { color: var(--green); }
    .stat-card.deleted .stat-value { color: var(--red); }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* Weekly Rhythm */
    .section {
      margin-bottom: 3rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text);
    }

    .section-title-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .weekly-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1rem;
    }

    .day-column {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .day-column:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .day-column {
      cursor: pointer;
    }

    .day-column.today {
      border-color: var(--accent);
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--surface) 100%);
    }

    .day-column.today::before {
      content: 'TODAY';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: var(--lavender);
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 0 0 0.5rem 0.5rem;
      letter-spacing: 0.05em;
    }

    .day-column.selected {
      border-color: var(--accent);
      background: var(--accent-light);
      box-shadow: var(--shadow-md);
    }

    .day-column.selected::after {
      content: '✓';
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* View Transition Styles */
    .weekly-grid {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .weekly-grid.view-week {
      grid-template-columns: repeat(7, 1fr);
    }

    .weekly-grid.view-month {
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .weekly-grid.view-day {
      grid-template-columns: 1fr;
      max-width: 800px;
      margin: 0 auto;
    }

    .day-column {
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s ease,
                  padding 0.3s ease,
                  min-height 0.3s ease;
    }

    .day-column.fade-out {
      opacity: 0;
      transform: scale(0.95);
    }

    .day-column.fade-in {
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Week-by-week staggered reveal animation for month view */
    @keyframes weekSlideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered delays by week row (0 = oldest, 4 = current/most recent) */
    .weekly-grid.view-month .day-column.week-stagger[data-week="4"] { animation-delay: 0ms; }
    .weekly-grid.view-month .day-column.week-stagger[data-week="3"] { animation-delay: 300ms; }
    .weekly-grid.view-month .day-column.week-stagger[data-week="2"] { animation-delay: 600ms; }
    .weekly-grid.view-month .day-column.week-stagger[data-week="1"] { animation-delay: 900ms; }
    .weekly-grid.view-month .day-column.week-stagger[data-week="0"] { animation-delay: 1200ms; }

    .weekly-grid.view-month .day-column.week-stagger {
      animation: weekSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    /* Month View - Compact Calendar Cards */
    .weekly-grid.view-month .day-column {
      padding: 0.75rem;
      min-height: auto;
    }

    .weekly-grid.view-month .day-date {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .weekly-grid.view-month .day-bars {
      min-height: 40px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .weekly-grid.view-month .activity-bar {
      height: 6px;
      margin-bottom: 1px;
    }

    .weekly-grid.view-month .activity-fill {
      height: 100%;
    }

    .weekly-grid.view-month .day-stats {
      font-size: 0.6rem;
      gap: 0.5rem;
    }

    .weekly-grid.view-month .day-column.inactive-month {
      opacity: 0.4;
    }

    /* Activity Intensity Dot for Month View */
    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.5rem;
    }

    .activity-dot.high { background: var(--green); }
    .activity-dot.medium { background: var(--amber); }
    .activity-dot.low { background: var(--border); }
    .activity-dot.none { background: transparent; border: 1px dashed var(--border); }

    /* Day View - Hero Display */
    .day-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      box-shadow: var(--shadow-md);
      animation: heroExpand 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes heroExpand {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .day-hero .hero-date {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .day-hero .hero-weekday {
      font-size: 1.25rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }

    .day-hero .hero-stats-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .day-hero .hero-stat {
      text-align: center;
    }

    .day-hero .hero-stat-value {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .day-hero .hero-stat-value.added { color: var(--green); }
    .day-hero .hero-stat-value.deleted { color: var(--red); }

    .day-hero .hero-stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Hourly Activity Chart */
    .hourly-chart {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .hourly-chart-title {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
      text-align: left;
    }

    .hourly-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 80px;
    }

    .hour-bar {
      flex: 1;
      background: var(--accent-light);
      border-radius: 2px 2px 0 0;
      min-height: 4px;
      transition: height 0.3s ease, background 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .hour-bar:hover {
      background: var(--accent);
    }

    .hour-bar:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .hour-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.6rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Repos touched that day */
    .day-repos {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .day-repos-title {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      text-align: left;
    }

    .day-repos-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-start;
    }

    .day-repo-chip {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .day-repo-chip:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .day-name {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }

    .day-date {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 1rem;
    }

    .day-bars {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 80px;
    }

    .activity-bar {
      height: 8px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      background: var(--border);
    }

    .activity-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease-out;
    }

    .day-stats {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
    }

    .day-stat {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .day-stat.added { color: var(--green); }
    .day-stat.deleted { color: var(--red); }

    /* Categories */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .category-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .category-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .category-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .category-icon { background: rgba(200, 200, 200, 0.2); }

    .category-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .category-count {
      margin-left: auto;
      background: var(--surface-elevated);
      padding: 0.25rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }

    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .repo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface-elevated);
      border-radius: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .repo-item:hover {
      background: var(--border);
    }

    .repo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .repo-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      flex: 1;
    }

    .repo-stats {
      display: flex;
      gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .repo-commits {
      background: var(--accent-light);
      color: #7A6B8A;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: 600;
    }

    .repo-added { color: var(--green); }
    .repo-deleted { color: var(--red); }

    /* Pull Requests */
    .pr-grid {
      display: grid;
      gap: 1rem;
    }

    .pr-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .pr-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .pr-card-main {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.25rem;
      align-items: center;
    }

    .pr-status {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .pr-status.open {
      background: var(--green-light);
    }

    .pr-status.merged {
      background: var(--accent-light);
    }

    .pr-status.closed {
      background: var(--red-light);
    }

    .pr-title-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--text);
      text-decoration: none;
      display: block;
    }

    .pr-title-text:hover {
      color: var(--accent);
    }

    .pr-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      align-items: center;
    }

    .pr-repo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .pr-branch {
      background: var(--surface-elevated);
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
    }

    .pr-stat-box {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    .pr-stat-box .added {
      color: var(--green);
      font-size: 1rem;
      font-weight: 600;
    }

    .pr-stat-box .deleted {
      color: var(--red);
      font-size: 1rem;
      font-weight: 600;
    }

    .pr-stat-box .files {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    /* Commit Timeline */
    .timeline {
      position: relative;
    }

    .timeline-day {
      margin-bottom: 2rem;
      position: relative;
    }

    .timeline-day-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      padding-left: 230px;
    }

    /* Git Graph */
    .git-graph-container {
      display: grid;
      grid-template-columns: 80px 80px 1fr;
      gap: 0;
      position: relative;
    }

    .git-graph {
      position: relative;
      width: 80px;
      min-height: 60px;
    }

    .git-graph svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .commit-item {
      display: grid;
      grid-template-columns: 80px 80px 1fr;
      gap: 0;
      margin-bottom: 0;
      position: relative;
      min-height: 80px;
    }

    .commit-time {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-secondary);
      padding-top: 1rem;
      padding-right: 1rem;
    }

    .commit-graph-cell {
      position: relative;
      width: 80px;
    }

    .commit-content {
      position: relative;
      padding-left: 1rem;
      padding-bottom: 0.75rem;
    }

    .commit-dot {
      position: absolute;
      top: 1rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid;
      background: var(--bg);
      z-index: 2;
      transform: translateX(-50%);
    }

    /* Graph lane lines */
    .graph-lane {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 2px;
      opacity: 0.6;
    }

    .graph-lane.active {
      opacity: 1;
    }

    /* Curved connection paths */
    .graph-path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .commit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .commit-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .commit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .commit-repo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      background: var(--surface-elevated);
    }

    .commit-stats {
      display: flex;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .commit-stats .added { color: var(--green); }
    .commit-stats .deleted { color: var(--red); }

    .commit-message {
      font-weight: 500;
      line-height: 1.5;
    }

    .commit-message a {
      color: inherit;
      text-decoration: none;
    }

    .commit-message a:hover {
      color: var(--accent);
    }

    .commit-hash {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #7A6B8A;
      background: var(--accent-light);
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      margin-left: 0.5rem;
      text-decoration: none;
    }

    .commit-hash:hover {
      background: var(--accent);
      color: white;
    }

    /* Expandable cards (shared between commits and PRs) */
    .expandable-card {
      cursor: pointer;
    }

    .commit-files, .pr-files {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
      font-size: 0.75rem;
      color: var(--text-secondary);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s ease;
    }

    /* Hover: peek state - show border and hint of first file */
    .expandable-card:hover .commit-files,
    .expandable-card:hover .pr-files {
      max-height: 28px;
      opacity: 0.6;
    }

    /* Expanded: full reveal */
    .expandable-card.expanded .commit-files,
    .expandable-card.expanded .pr-files {
      max-height: 500px;
      opacity: 1;
    }

    /* PR Description Preview */
    .pr-description {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-height: 8em;
      overflow: hidden;
      position: relative;
    }

    .pr-description::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3em;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }

    .pr-description-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Hide fade when expanded */
    .expandable-card.expanded .pr-description::after {
      display: none;
    }

    .expandable-card.expanded .pr-description {
      max-height: none;
    }

    /* Commit Description Preview */
    .commit-description {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-height: 4em;
      overflow: hidden;
      position: relative;
    }

    .commit-description::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2em;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }

    .commit-description-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .expandable-card.expanded .commit-description::after {
      display: none;
    }

    .expandable-card.expanded .commit-description {
      max-height: none;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .file-item .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 1rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .weekly-grid.view-week {
        grid-template-columns: repeat(4, 1fr);
      }
      .weekly-grid.view-month {
        grid-template-columns: repeat(7, 1fr);
        gap: 0.35rem;
      }
      .weekly-grid.view-month .day-column {
        padding: 0.5rem;
      }
      .weekly-grid.view-month .day-name {
        font-size: 0.55rem;
      }
      .weekly-grid.view-month .day-date {
        font-size: 0.9rem;
      }
      .weekly-grid.view-day {
        max-width: 100%;
      }
      .commit-item {
        grid-template-columns: 70px 60px 1fr;
        gap: 0;
      }
      .timeline-day-header {
        padding-left: 140px;
      }
      .timeline-graph-svg {
        left: 70px !important;
        width: 60px !important;
      }
    }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .hero-left h1 { font-size: 2.5rem; }
      .hero-content { flex-wrap: wrap; }
      .hero-stats { flex-wrap: wrap; }
      .weekly-grid.view-week { grid-template-columns: repeat(2, 1fr); }
      .weekly-grid.view-month {
        grid-template-columns: repeat(7, 1fr);
        gap: 0.25rem;
      }
      .weekly-grid.view-month .day-column {
        padding: 0.35rem;
      }
      .weekly-grid.view-month .day-name {
        font-size: 0.45rem;
      }
      .weekly-grid.view-month .day-date {
        font-size: 0.75rem;
        margin-bottom: 0.25rem;
      }
      .weekly-grid.view-month .day-bars {
        display: none;
      }
      .weekly-grid.view-month .day-stats {
        display: none;
      }
      .day-hero .hero-date {
        font-size: 2rem;
      }
      .day-hero .hero-stats-row {
        flex-wrap: wrap;
        gap: 1rem;
      }
      .hourly-bars {
        height: 60px;
      }
      .categories-grid { grid-template-columns: 1fr; }
      .timeline-graph-svg { display: none; }
      .commit-item { grid-template-columns: 60px 1fr; gap: 0.5rem; }
      .commit-graph-cell { display: none; }
      .commit-time { text-align: right; padding-top: 0.75rem; font-size: 0.7rem; }
      .commit-content { padding-left: 0.5rem; border-left: 3px solid var(--accent); }
      .timeline-day-header { padding-left: 0; }
      .pr-card { grid-template-columns: auto 1fr; gap: 1rem; }
      .pr-stat-box { display: none; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  
  <div class="container">
    <!-- Hero Section -->
    <header class="hero">
      <div class="hero-content">
        <div class="hero-left">
          <h1>Dev Pulse</h1>
          <div class="hero-tagline">
            <span class="live-dot"></span>
            <span id="period-label">Engineering velocity this week</span>
          </div>
          <div class="time-toggle">
            <button class="toggle-btn" data-period="day">Day</button>
            <button class="toggle-btn active" data-period="week">Week</button>
            <button class="toggle-btn" data-period="month">Month</button>
          </div>
        </div>
        <div class="hero-stats">
          <div class="stat-card repos">
            <div class="stat-value" id="repos-count">0</div>
            <div class="stat-label">Repos Active</div>
          </div>
          <div class="stat-card commits">
            <div class="stat-value" id="commits-count">0</div>
            <div class="stat-label">Commits</div>
          </div>
          <div class="stat-card added">
            <div class="stat-value" id="added-count">+0</div>
            <div class="stat-label">Lines Added</div>
          </div>
          <div class="stat-card deleted">

            <div class="stat-label">Lines Removed</div>
          </div>
          <div class="stat-card prs">

    <!-- Weekly Rhythm -->
    <section class="section">

        <button class="toggle-btn" id="back-to-week-btn" style="display: none;" onclick="backToWeekView()">
          ← Back to Week
        </button>
      </div>
      <div class="weekly-grid view-week" id="weekly-grid">
        <!-- Filled by JS -->

    <!-- Project Categories -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">📦</span>
          Project Breakdown
        </h2>
      </div>
      <div class="categories-grid" id="categories-grid">
        <!-- Filled by JS -->

    </section>

    <!-- Pull Requests -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">🔀</span>
          Pull Requests
        </h2>
      </div>
      <div class="pr-grid" id="pr-grid">
        <!-- Filled by JS -->
      </div>
    </section>

    <!-- Commit Timeline -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">⚡</span>
          Commit Timeline
        </h2>
      </div>
      <div class="timeline" id="timeline">
        <!-- Filled by JS -->
      </div>
    </section>

    <footer class="footer">
      <p>Auto-generated daily by
        <a href="https://github.com/verygoodplugins/autohub" target="_blank" style="display: inline-flex; align-items: center; gap: 0.35rem;">
          <svg viewBox="0 0 100 100" style="width: 18px; height: 18px; vertical-align: middle;">
            <defs>
              <linearGradient id="goldGradientFooter" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FFE082"/>
                <stop offset="50%" style="stop-color:#F9D857"/>
                <stop offset="100%" style="stop-color:#DAA520"/>
              </linearGradient>
            </defs>
            <rect x="10" y="10" width="80" height="80" rx="8" fill="url(#goldGradientFooter)" stroke="#1a1a1a" stroke-width="3"/>
            <rect x="30" y="15" width="40" height="25" rx="3" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="2"/>
            <rect x="55" y="20" width="12" height="15" rx="2" fill="#1a1a1a"/>
            <circle cx="38" cy="60" r="5" fill="#1a1a1a"/>
            <circle cx="62" cy="60" r="5" fill="#1a1a1a"/>
            <path d="M42 72 Q50 80 58 72" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          AutoHub
        </a>
      </p>
    </footer>
  </div>

  <script>
    // Site configuration (overridden by site-config.json if present)
    let SITE_CONFIG = {
      title: 'Dev Pulse',
      tagline: 'Engineering velocity',
      accentColor: null,
      logo: null
    };

    // Load and render activity data
    let rawData = null;
    let currentPeriod = 'week';
    let currentView = 'week';  // 'day' | 'week' | 'month'
    let viewTransitioning = false;
    let selectedDate = null; // When set, filters to specific day

    const PERIOD_LABELS = {
      'day': 'last 24 hours',
      'week': 'this week',
      'month': 'this month'
    };

    const PERIOD_CONFIG = {
      'day': { hours: 24, get label() { return SITE_CONFIG.tagline + ' ' + PERIOD_LABELS.day; } },
      'week': { hours: 168, get label() { return SITE_CONFIG.tagline + ' ' + PERIOD_LABELS.week; } },
      'month': { hours: 720, get label() { return SITE_CONFIG.tagline + ' ' + PERIOD_LABELS.month; } }
    };

    function getRepoLabel(repoName) {
      return repoName;
    }

    function applySiteConfig() {
      // Title
      if (SITE_CONFIG.title) {
        document.querySelector('.hero-left h1').textContent = SITE_CONFIG.title;
        document.title = SITE_CONFIG.title + ' | Activity Dashboard';
      }
      // Period label (tagline + period suffix)
      document.getElementById('period-label').textContent = PERIOD_CONFIG[currentPeriod].label;
      // Accent color override
      if (SITE_CONFIG.accentColor) {
        document.documentElement.style.setProperty('--accent', SITE_CONFIG.accentColor);
        document.documentElement.style.setProperty('--accent-light', SITE_CONFIG.accentColor + '26');
      }
      // Custom logo (replaces h1 text with image)
      if (SITE_CONFIG.logo) {
        const h1 = document.querySelector('.hero-left h1');
        h1.textContent = '';
        const img = document.createElement('img');
        img.src = SITE_CONFIG.logo;
        img.alt = SITE_CONFIG.title || 'Dev Pulse';
        img.style.cssText = 'height: 2em; vertical-align: middle;';
        h1.appendChild(img);
      }
    }

    // Categories loaded from categories.json (optional)
    // If no categories.json exists, repos are shown ungrouped.
    let CATEGORY_CONFIG = {};

    // Generate deterministic colors from repo names
    function hashColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 55%, 65%)`;
    }

    const REPO_COLORS = new Proxy({}, {
      get: (target, prop) => target[prop] || hashColor(String(prop))
    });

    function formatNumber(num) {
      if (num >= 1000) {
        return (num / 1000).toFixed(1) + 'k';
      }
      return num.toString();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Simple markdown renderer for PR/commit descriptions
    function renderMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);

      // Headers (## and ###)
      html = html.replace(/^### (.+)$/gm, '<strong style="font-size: 0.85em;">$1</strong>');
      html = html.replace(/^## (.+)$/gm, '<strong style="font-size: 0.9em;">$1</strong>');

      // Bold and italic
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code style="background: var(--surface-elevated); padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.9em;">$1</code>');

      // Links [text](url) - sanitize URLs to prevent javascript: injection
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, text, url) => {
        const sanitizedUrl = url.trim();
        if (!/^https?:\/\//i.test(sanitizedUrl)) {
          return text;
        }
        return `<a href="${sanitizedUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color: var(--accent);">${text}</a>`;
      });

      // Bullet points (- item)
      html = html.replace(/^- (.+)$/gm, '<span style="display: block; padding-left: 1em;">• $1</span>');

      // Line breaks
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    function animateCounter(element, target, prefix = '', duration = 1500) {
      const start = 0;
      const startTime = performance.now();
      
      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (target - start) * eased);
        element.textContent = prefix + formatNumber(current);
        
        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }
      
      requestAnimationFrame(update);
    }

    function filterByPeriod(commits, period) {
      const now = new Date();
      const hoursAgo = PERIOD_CONFIG[period].hours;
      const cutoff = new Date(now.getTime() - hoursAgo * 60 * 60 * 1000);
      return commits.filter(c => new Date(c.date) >= cutoff);
    }

    function filterByDate(items, date) {
      const targetDate = date.toDateString();
      return items.filter(item => {
        const itemDate = new Date(item.date).toDateString();
        return itemDate === targetDate;
      });
    }

    function formatDateLabel(date) {
      const today = new Date();
      if (date.toDateString() === today.toDateString()) {
        return "Today's engineering velocity";
      }
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      return date.toLocaleDateString('en-US', options) + ' velocity';
    }

    async function loadData() {
      try {
        const response = await fetch('activity-data.json');
        rawData = await response.json();

        // Load optional site config (title, tagline, branding)
        try {
          const siteResponse = await fetch('site-config.json');
          if (siteResponse.ok) {
            Object.assign(SITE_CONFIG, await siteResponse.json());
          }
        } catch (e) {
          // No site-config.json — using defaults
        }

        // Load optional categories config
        try {
          const catResponse = await fetch('categories.json');
          if (catResponse.ok) {
            CATEGORY_CONFIG = await catResponse.json();
          }
        } catch (e) {
          // No categories.json — repos will be shown ungrouped
        }

        // Apply site config to the page
        applySiteConfig();

        renderDashboard();
        setupToggleButtons();
      } catch (error) {
        console.error('Failed to load activity data:', error);
      }
    }

    function setupToggleButtons() {
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const newPeriod = btn.dataset.period;
          // Skip the back-to-week button (it has its own handler)
          if (!newPeriod || viewTransitioning) return;

          document.querySelectorAll('.toggle-btn[data-period]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentPeriod = newPeriod;
          selectedDate = null; // Clear day selection when using period toggles
          document.getElementById('period-label').textContent = PERIOD_CONFIG[currentPeriod].label;

          // Map period to view: day/week periods use week view, month uses month view
          const newView = newPeriod === 'month' ? 'month' : 'week';
          transitionToView(newView);
        });
      });
    }

    // FLIP animation for smooth view transitions
    function transitionToView(newView, targetDate = null) {
      if (viewTransitioning || (newView === currentView && !targetDate)) return;
      viewTransitioning = true;

      const grid = document.getElementById('weekly-grid');
      const dayColumns = grid.querySelectorAll('.day-column, .day-hero');

      // FLIP: First - record current positions
      const firstPositions = new Map();
      dayColumns.forEach((el, i) => {
        const rect = el.getBoundingClientRect();
        firstPositions.set(i, { x: rect.left, y: rect.top, width: rect.width, height: rect.height });
      });

      // Apply fade-out to current elements
      dayColumns.forEach(el => el.classList.add('fade-out'));

      setTimeout(() => {
        // Update view class
        grid.classList.remove('view-week', 'view-month', 'view-day');
        grid.classList.add(`view-${newView}`);
        currentView = newView;

        // Update section title and back button visibility
        const titleText = document.getElementById('rhythm-title-text');
        const backBtn = document.getElementById('back-to-week-btn');

        if (newView === 'month') {
          titleText.textContent = 'Monthly Calendar';
          backBtn.style.display = 'inline-block';
        } else if (newView === 'day') {
          titleText.textContent = 'Day Detail';
          backBtn.style.display = 'inline-block';
        } else {
          titleText.textContent = 'Weekly Rhythm';
          backBtn.style.display = 'none';
        }

        // Re-render content based on view
        if (newView === 'month') {
          // Use staggered animation for month view - weeks appear one by one
          renderMonthView(rawData.commits, true);
          // Extended timeout for staggered animation to complete (~1.7s total)
          setTimeout(() => {
            viewTransitioning = false;
            renderDashboard();
          }, 1800);
          return;
        } else if (newView === 'day' && targetDate) {
          selectedDate = targetDate;
          renderDayView(targetDate, rawData.commits);
        } else {
          selectedDate = null;
          renderWeeklyRhythm(rawData.commits);
        }

        // Animate new elements in (for non-month views)
        const newElements = grid.querySelectorAll('.day-column, .day-hero');
        newElements.forEach((el, i) => {
          el.classList.add('fade-in');
          setTimeout(() => el.classList.remove('fade-in'), 300);
        });

        viewTransitioning = false;
        renderDashboard();
      }, 200);
    }

    function backToWeekView() {
      // Reset to week view and restore period toggle
      document.querySelectorAll('.toggle-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.period === 'week');
      });
      currentPeriod = 'week';
      document.getElementById('period-label').textContent = PERIOD_CONFIG.week.label;
      transitionToView('week');
    }

    function selectDay(date) {
      selectedDate = date;
      // Clear period toggle active states
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('period-label').textContent = formatDateLabel(date);
      // Use transitionToView for day view
      transitionToView('day', date);
    }

    function renderDashboard() {
      const allCommits = rawData.commits || [];
      const allPrs = rawData.prs || [];

      let commits, prs;

      if (selectedDate) {
        // Filter to specific day
        commits = filterByDate(allCommits, selectedDate);
        prs = filterByDate(allPrs, selectedDate);
      } else {
        // Filter by period
        commits = filterByPeriod(allCommits, currentPeriod);
        prs = filterByPeriod(allPrs, currentPeriod);
      }

      let totalAdded = 0;
      let totalDeleted = 0;
      const activeRepos = new Set();

      commits.forEach(c => {
        if (c.stats) {
          totalAdded += c.stats.added || 0;
          totalDeleted += c.stats.deleted || 0;
        }
        activeRepos.add(c.repo);
      });

      // Animate counters
      animateCounter(document.getElementById('repos-count'), activeRepos.size);
      animateCounter(document.getElementById('commits-count'), commits.length);
      animateCounter(document.getElementById('added-count'), totalAdded, '+');
      animateCounter(document.getElementById('deleted-count'), totalDeleted, '-');
      animateCounter(document.getElementById('prs-count'), prs.length);

      // Render weekly rhythm section based on current view
      // (only re-render if not in a transition - transitionToView handles the grid)
      if (!viewTransitioning) {
        if (currentView === 'week') {
          renderWeeklyRhythm(allCommits);
        } else if (currentView === 'month') {
          // Don't apply stagger on re-renders, only on transitions
          renderMonthView(allCommits, false);
        } else if (currentView === 'day' && selectedDate) {
          renderDayView(selectedDate, allCommits);
        }
      }

      // Render other sections
      renderCategories(commits);
      renderPullRequests(prs);
      renderTimeline(commits);
    }

    function renderWeeklyRhythm(commits) {
      const container = document.getElementById('weekly-grid');
      const days = [];
      const today = new Date();
      
      // Get last 7 days
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        days.push(date);
      }

      // Group commits by day
      const commitsByDay = {};
      commits.forEach(c => {
        const date = new Date(c.date);
        const key = date.toDateString();
        if (!commitsByDay[key]) {
          commitsByDay[key] = { commits: 0, added: 0, deleted: 0, repos: {} };
        }
        commitsByDay[key].commits++;
        commitsByDay[key].added += c.stats?.added || 0;
        commitsByDay[key].deleted += c.stats?.deleted || 0;
        
        const repo = c.repo;
        if (!commitsByDay[key].repos[repo]) {
          commitsByDay[key].repos[repo] = 0;
        }
        commitsByDay[key].repos[repo]++;
      });

      // Find max for scaling
      const maxAdded = Math.max(...Object.values(commitsByDay).map(d => d.added), 1);

      container.innerHTML = days.map((date, index) => {
        const key = date.toDateString();
        const dayData = commitsByDay[key] || { commits: 0, added: 0, deleted: 0, repos: {} };
        const isToday = date.toDateString() === today.toDateString();
        const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();
        const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

        // Create repo bars
        const repoEntries = Object.entries(dayData.repos);
        const bars = repoEntries.slice(0, 4).map(([repo, count]) => {
          const color = REPO_COLORS[repo] || '#B8C4D0';
          const width = Math.max((count / Math.max(...Object.values(dayData.repos))) * 100, 10);
          return `<div class="activity-bar">
            <div class="activity-fill" style="background: ${color}; width: ${width}%;"></div>
          </div>`;
        }).join('');

        const classes = ['day-column'];
        if (isToday) classes.push('today');
        if (isSelected) classes.push('selected');

        return `
          <div class="${classes.join(' ')}" data-date-index="${index}" onclick="handleDayClick(${index})">
            <div class="day-name">${dayNames[date.getDay()]}</div>
            <div class="day-date">${date.getDate()}</div>
            <div class="day-bars">${bars || '<div style="color: var(--text-secondary); font-size: 0.75rem; opacity: 0.5;">No activity</div>'}</div>
            <div class="day-stats">
              <span class="day-stat added">+${formatNumber(dayData.added)}</span>
              <span class="day-stat deleted">-${formatNumber(dayData.deleted)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Store days array globally for click handler
    let weekDays = [];

    function handleDayClick(index) {
      const today = new Date();
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        days.push(date);
      }
      // Transition to day view instead of just filtering
      transitionToView('day', days[index]);
    }

    function handleMonthDayClick(dateStr) {
      const date = new Date(dateStr);
      transitionToView('day', date);
    }

    function renderMonthView(commits, applyStagger = false) {
      const container = document.getElementById('weekly-grid');
      const today = new Date();
      const days = [];

      // Get last 35 days (5 weeks) for calendar view
      for (let i = 34; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        days.push(date);
      }

      // Group commits by day WITH repo-level tracking
      const commitsByDay = {};
      commits.forEach(c => {
        const date = new Date(c.date);
        const key = date.toDateString();
        if (!commitsByDay[key]) {
          commitsByDay[key] = { commits: 0, added: 0, deleted: 0, repos: {} };
        }
        commitsByDay[key].commits++;
        commitsByDay[key].added += c.stats?.added || 0;
        commitsByDay[key].deleted += c.stats?.deleted || 0;

        // Track per-repo commits for mini bars
        const repo = c.repo;
        if (!commitsByDay[key].repos[repo]) {
          commitsByDay[key].repos[repo] = 0;
        }
        commitsByDay[key].repos[repo]++;
      });

      const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

      container.innerHTML = days.map((date, index) => {
        const key = date.toDateString();
        const dayData = commitsByDay[key] || { commits: 0, added: 0, deleted: 0, repos: {} };
        const isToday = date.toDateString() === today.toDateString();
        const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();

        // Calculate week row (0 = oldest week, 4 = most recent/current week)
        // Days are ordered 0-34, with 0 being oldest. Rows: 0-6=week0, 7-13=week1, etc.
        const weekRow = Math.floor(index / 7);

        // Build mini activity bars from repo data (top 3 repos)
        const repoEntries = Object.entries(dayData.repos);
        const maxRepoCommits = Math.max(...Object.values(dayData.repos), 1);
        const bars = repoEntries
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3)
          .map(([repo, count]) => {
            const color = REPO_COLORS[repo] || '#B8C4D0';
            const width = Math.max((count / maxRepoCommits) * 100, 15);
            return `<div class="activity-bar">
              <div class="activity-fill" style="background: ${color}; width: ${width}%;"></div>
            </div>`;
          }).join('');

        const classes = ['day-column'];
        if (isToday) classes.push('today');
        if (isSelected) classes.push('selected');
        if (applyStagger) classes.push('week-stagger');

        return `
          <div class="${classes.join(' ')}" data-week="${weekRow}" onclick="handleMonthDayClick('${date.toISOString()}')">
            <div class="day-name">${dayNames[date.getDay()]}</div>
            <div class="day-date">${date.getDate()}</div>
            <div class="day-bars">
              ${bars || '<div style="opacity: 0.3; font-size: 0.6rem; color: var(--text-secondary)">—</div>'}
            </div>
            <div class="day-stats">
              <span class="day-stat added">+${formatNumber(dayData.added)}</span>
              <span class="day-stat deleted">-${formatNumber(dayData.deleted)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDayView(date, commits) {
      const container = document.getElementById('weekly-grid');
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      // Filter commits for this specific day
      const dayCommits = commits.filter(c => {
        const commitDate = new Date(c.date);
        return commitDate.toDateString() === date.toDateString();
      });

      // Calculate stats
      let totalAdded = 0, totalDeleted = 0;
      const repoStats = {};
      const hourlyActivity = new Array(24).fill(0);

      dayCommits.forEach(c => {
        totalAdded += c.stats?.added || 0;
        totalDeleted += c.stats?.deleted || 0;

        // Track repos
        if (!repoStats[c.repo]) {
          repoStats[c.repo] = { commits: 0, url: c.remoteUrl };
        }
        repoStats[c.repo].commits++;

        // Track hourly activity
        const hour = new Date(c.date).getHours();
        hourlyActivity[hour]++;
      });

      const maxHourly = Math.max(...hourlyActivity, 1);

      // Build hourly chart bars
      const hourlyBars = hourlyActivity.map((count, hour) => {
        const height = count > 0 ? Math.max((count / maxHourly) * 100, 10) : 4;
        const tooltip = `${hour}:00 - ${count} commit${count !== 1 ? 's' : ''}`;
        return `<div class="hour-bar" style="height: ${height}%" data-tooltip="${tooltip}"></div>`;
      }).join('');

      // Build repo chips
      const repoChips = Object.entries(repoStats)
        .sort((a, b) => b[1].commits - a[1].commits)
        .slice(0, 8)
        .map(([repo, data]) => {
          const color = REPO_COLORS[repo] || '#6366f1';
          return `
            <a href="${data.url}" target="_blank" class="day-repo-chip">
              <span class="repo-dot" style="background: ${color}"></span>
              ${repo}
              <span style="color: var(--text-secondary)">${data.commits}</span>
            </a>
          `;
        }).join('');

      const isToday = date.toDateString() === new Date().toDateString();
      const dateLabel = isToday ? 'Today' : `${monthNames[date.getMonth()]} ${date.getDate()}`;

      container.innerHTML = `
        <div class="day-hero">
          <div class="hero-weekday">${dayNames[date.getDay()]}</div>
          <div class="hero-date">${dateLabel}</div>
          <div class="hero-stats-row">
            <div class="hero-stat">
              <div class="hero-stat-value">${dayCommits.length}</div>
              <div class="hero-stat-label">Commits</div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-value added">+${formatNumber(totalAdded)}</div>
              <div class="hero-stat-label">Lines Added</div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-value deleted">-${formatNumber(totalDeleted)}</div>
              <div class="hero-stat-label">Lines Removed</div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-value">${Object.keys(repoStats).length}</div>
              <div class="hero-stat-label">Repos</div>
            </div>
          </div>
          ${dayCommits.length > 0 ? `
          <div class="hourly-chart">
            <div class="hourly-chart-title">Activity by Hour</div>
            <div class="hourly-bars">${hourlyBars}</div>
            <div class="hour-labels">
              <span>12am</span>
              <span>6am</span>
              <span>12pm</span>
              <span>6pm</span>
              <span>11pm</span>
            </div>
          </div>
          <div class="day-repos">
            <div class="day-repos-title">Repos Touched</div>
            <div class="day-repos-grid">${repoChips || '<span style="color: var(--text-secondary)">No repos</span>'}</div>
          </div>
          ` : '<p style="color: var(--text-secondary); margin-top: 1rem;">No activity on this day</p>'}
        </div>
      `;
    }

    function renderCategories(commits) {
      const container = document.getElementById('categories-grid');
      
      // Group commits by repo
      const repoStats = {};
      commits.forEach(c => {
        const repo = c.repo;
        if (!repoStats[repo]) {
          repoStats[repo] = { 
            commits: 0, 
            added: 0, 
            deleted: 0,
            url: c.remoteUrl
          };
        }
        repoStats[repo].commits++;
        repoStats[repo].added += c.stats?.added || 0;
        repoStats[repo].deleted += c.stats?.deleted || 0;
      });

      // Categorize repos
      const categorized = {};
      
      Object.entries(CATEGORY_CONFIG).forEach(([category, config]) => {
        categorized[category] = {
          ...config,
          repos: []
        };
      });
      
      categorized['Other'] = {
        icon: '📁',
        class: 'other',
        repos: []
      };

      Object.entries(repoStats).forEach(([repo, stats]) => {
        let found = false;
        for (const [category, config] of Object.entries(CATEGORY_CONFIG)) {
          if (config.repos.includes(repo)) {
            categorized[category].repos.push({ name: repo, ...stats });
            found = true;
            break;
          }
        }
        if (!found) {
          categorized['Other'].repos.push({ name: repo, ...stats });
        }
      });

      container.innerHTML = Object.entries(categorized)
        .filter(([_, cat]) => cat.repos.length > 0)
        .map(([name, cat]) => {
          const totalCommits = cat.repos.reduce((sum, r) => sum + r.commits, 0);
          const repoItems = cat.repos
            .sort((a, b) => b.commits - a.commits)
            .map(repo => `
              <a href="${repo.url}" target="_blank" class="repo-item">
                <span class="repo-dot" style="background: ${REPO_COLORS[repo.name] || '#6366f1'}"></span>
                <span class="repo-name">${repo.name}</span>
                <div class="repo-stats">
                  <span class="repo-commits">${repo.commits}c</span>
                  <span class="repo-added">+${formatNumber(repo.added)}</span>
                  <span class="repo-deleted">-${formatNumber(repo.deleted)}</span>
                </div>
              </a>
            `).join('');

          return `
            <div class="category-card">
              <div class="category-header">
                <span class="category-icon ${cat.class}">${cat.icon}</span>
                <span class="category-name">${name}</span>
                <span class="category-count">${totalCommits} commits</span>
              </div>
              <div class="repo-list">${repoItems}</div>
            </div>
          `;
        }).join('');
    }

    function renderPullRequests(prs) {
      const container = document.getElementById('pr-grid');

      container.innerHTML = prs.slice(0, 10).map(pr => {
        const state = pr.state === 'MERGED' ? 'merged' : (pr.state === 'CLOSED' ? 'closed' : 'open');
        const stateIcon = state === 'merged' ? '🔀' : (state === 'open' ? '🟢' : '🔴');
        const isMergeable = pr.mergeable === 'MERGEABLE';
        const fileCount = pr.stats?.files || 0;

        const prFiles = pr.files || [];
        const hasFileDetails = prFiles.length > 0;

        // Truncate body to first section or ~500 chars
        const bodyPreview = pr.body
          ? pr.body.split(/\n\n|\r\n\r\n/)[0].slice(0, 500)
          : '';
        const hasBody = bodyPreview.length > 0;

        const files = prFiles
          .slice(0, 10)
          .map(f => `
            <div class="file-item">
              <span class="file-name">${f.file || f.path || f}</span>
              ${f.added !== undefined ? `<span><span class="added">+${f.added}</span> <span class="deleted">-${f.deleted}</span></span>` : ''}
            </div>
          `).join('');

        // Card is expandable if it has body OR file details
        const isExpandable = hasBody || hasFileDetails;

        return `
          <div class="pr-card ${isExpandable ? 'expandable-card' : ''}" ${isExpandable ? 'onclick="this.classList.toggle(\'expanded\')"' : ''}>
            <div class="pr-card-main">
              <div class="pr-status ${state}">${stateIcon}</div>
              <div class="pr-info">
                <a href="${pr.url}" target="_blank" class="pr-title-text" onclick="event.stopPropagation()">${pr.title}</a>
                <div class="pr-meta">
                  <span class="pr-repo">${getRepoLabel(pr.repo)}</span>
                  <span class="pr-branch">${pr.headBranch} → ${pr.baseBranch}</span>
                  <span>${pr.commits} commits</span>
                  ${isMergeable ? '<span style="color: var(--green)">✓ Mergeable</span>' : ''}
                </div>
              </div>
              <div class="pr-stat-box">
                <div class="added">+${formatNumber(pr.stats?.added || 0)}</div>
                <div class="deleted">-${formatNumber(pr.stats?.deleted || 0)}</div>
                <div class="files">${fileCount} files</div>
              </div>
            </div>
            ${hasBody ? `
              <div class="pr-description">
                <div class="pr-description-text">${renderMarkdown(bodyPreview)}</div>
              </div>
            ` : ''}
            ${hasFileDetails ? `<div class="pr-files">${files}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderTimeline(commits) {
      const container = document.getElementById('timeline');

      // Group by day
      const byDay = {};
      commits.forEach(c => {
        const date = new Date(c.date);
        const key = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        if (!byDay[key]) byDay[key] = [];
        byDay[key].push(c);
      });

      // Build lane assignments - active repos get lanes
      const activeRepos = [...new Set(commits.map(c => c.repo))];
      // Sort by commit count to put most active repos in primary lanes
      const repoCommitCounts = {};
      commits.forEach(c => { repoCommitCounts[c.repo] = (repoCommitCounts[c.repo] || 0) + 1; });
      activeRepos.sort((a, b) => repoCommitCounts[b] - repoCommitCounts[a]);

      // Assign lane positions (max 6 lanes shown)
      const laneAssignments = {};
      activeRepos.slice(0, 6).forEach((repo, i) => {
        laneAssignments[repo] = i;
      });
      const LANE_WIDTH = 12;
      const LANE_GAP = 2;
      const GRAPH_PADDING = 10;

      container.innerHTML = Object.entries(byDay).map(([day, dayCommits]) => {
        // Track last commit position per repo for drawing connections
        const lastCommitY = {};
        const ROW_HEIGHT = 80; // Approximate height per commit

        // Build SVG paths for this day
        let svgPaths = '';
        let svgDots = '';
        const limitedCommits = dayCommits.slice(0, 15);

        limitedCommits.forEach((c, idx) => {
          const lane = laneAssignments[c.repo];
          if (lane === undefined) return; // Skip repos without lanes

          const color = REPO_COLORS[c.repo] || '#6366f1';
          const x = GRAPH_PADDING + lane * (LANE_WIDTH + LANE_GAP) + LANE_WIDTH / 2;
          const y = idx * ROW_HEIGHT + ROW_HEIGHT / 2;

          // Draw connection from previous commit of same repo
          if (lastCommitY[c.repo] !== undefined) {
            const prevY = lastCommitY[c.repo];
            // Bezier curve connecting previous to current
            const midY = (prevY + y) / 2;
            svgPaths += `<path class="graph-path" d="M${x},${prevY} C${x},${midY} ${x},${midY} ${x},${y}" stroke="${color}" opacity="0.7"/>`;
          }

          // Draw the commit dot
          svgDots += `<circle cx="${x}" cy="${y}" r="5" fill="${color}" stroke="var(--bg)" stroke-width="2"/>`;

          lastCommitY[c.repo] = y;
        });

        // Calculate SVG height
        const svgHeight = limitedCommits.length * ROW_HEIGHT;

        // Draw vertical lane lines (faded) for context
        let laneLines = '';
        Object.entries(laneAssignments).forEach(([repo, lane]) => {
          const color = REPO_COLORS[repo] || '#6366f1';
          const x = GRAPH_PADDING + lane * (LANE_WIDTH + LANE_GAP) + LANE_WIDTH / 2;
          laneLines += `<line x1="${x}" y1="0" x2="${x}" y2="${svgHeight}" stroke="${color}" stroke-width="2" opacity="0.15"/>`;
        });

        const commitItems = limitedCommits.map((c, idx) => {
          const time = new Date(c.date).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          const color = REPO_COLORS[c.repo] || '#6366f1';
          const lane = laneAssignments[c.repo];
          const dotX = lane !== undefined ? GRAPH_PADDING + lane * (LANE_WIDTH + LANE_GAP) + LANE_WIDTH / 2 : 40;

          const fileList = (c.files || []).filter(f => f.added > 0 || f.deleted > 0);
          const hasFiles = fileList.length > 0;
          const files = fileList
            .slice(0, 8)
            .map(f => `
              <div class="file-item">
                <span class="file-name">${f.file}</span>
                <span><span class="added">+${f.added}</span> <span class="deleted">-${f.deleted}</span></span>
              </div>
            `).join('');

          // Truncate body to first section or ~300 chars
          const bodyPreview = c.body
            ? c.body.split(/\n\n|\r\n\r\n/)[0].slice(0, 300)
            : '';
          const hasBody = bodyPreview.length > 0;

          // Card is expandable if it has body OR file details
          const isExpandable = hasBody || hasFiles;

          return `
            <div class="commit-item" data-repo="${c.repo}" data-idx="${idx}">
              <div class="commit-time">${time}</div>
              <div class="commit-graph-cell">
                <!-- Dot rendered via SVG overlay -->
              </div>
              <div class="commit-content">
                <div class="commit-card ${isExpandable ? 'expandable-card' : ''}" ${isExpandable ? 'onclick="this.classList.toggle(\'expanded\')"' : ''}>
                  <div class="commit-header">
                    <span class="commit-repo" style="color: ${color}">${getRepoLabel(c.repo)}</span>
                    <div class="commit-stats">
                      <span class="added">+${c.stats?.added || 0}</span>
                      <span class="deleted">-${c.stats?.deleted || 0}</span>
                    </div>
                  </div>
                  <div class="commit-message">
                    <a href="https://github.com/${c.owner}/${c.repo}/commit/${c.hash}" target="_blank" onclick="event.stopPropagation()">${c.headline}</a>
                    <a href="https://github.com/${c.owner}/${c.repo}/commit/${c.hash}" target="_blank" class="commit-hash" onclick="event.stopPropagation()">${c.shortHash}</a>
                  </div>
                  ${hasBody ? `
                    <div class="commit-description">
                      <div class="commit-description-text">${renderMarkdown(bodyPreview)}</div>
                    </div>
                  ` : ''}
                  ${hasFiles ? `<div class="commit-files">${files}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="timeline-day">
            <div class="timeline-day-header">${day}</div>
            <div class="timeline-commits-wrapper" style="position: relative;">
              <svg class="timeline-graph-svg" width="80" height="${svgHeight}" style="position: absolute; left: 80px; top: 0; pointer-events: none; z-index: 1;">
                ${laneLines}
                ${svgPaths}
                ${svgDots}
              </svg>
              ${commitItems}
            </div>
          </div>
        `;
      }).join('');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
